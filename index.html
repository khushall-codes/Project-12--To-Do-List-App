<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Heading -->
        <div class="header">
            <h1>My To-Do List</h1>
            <p>Organize your day, one task at a time.</p>
        </div>


        <!-- Add Task -->
        <div class="input-box">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
            >

            <button id="addBtn">
                Add Task
            </button>

        </div>


        <!-- Task List -->
        <ul id="taskList"></ul>


        <!-- Bottom -->
        <div class="bottom">

            <p>
                Remaining Tasks:
                <span id="taskCount">0</span>
            </p>

            <button id="clearBtn">
                Clear Completed
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
